<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Problems</title>
    <link rel="stylesheet" href="/static/admin_problems.css">
</head>

<body>
    <main class="page">

        <!-- Header -->
        <header class="page-header">
            <h1>Manage Problems</h1>
            <p>Event: {{ event.title }}</p>
        </header>

        <!-- Add Problem -->
        <section class="panel">
            <h2>Add New Problem</h2>

            <form method="post">
                <div class="field">
                    <label>Problem Title</label>
                    <input name="title" placeholder="Eg: Two Sum" required>
                </div>

                <div class="field">
                    <label>Description</label>
                    <textarea name="description" placeholder="Describe the problem statement clearly..."
                        required></textarea>
                </div>

                <button type="submit">Add Problem</button>
            </form>
        </section>

        <!-- Problems Table -->
        <section class="panel panel-soft">
            <h2>Existing Problems</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th class="actions-col">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for p in problems %}
                        <tr>
                            <td>{{ loop.index }}</td>
                            <td>{{ p.title }}</td>
                            <td class="desc">{{ p.description }}</td>
                            <td class="actions">
                                <a href="/admin/problems/edit/{{ p._id }}" class="btn btn-edit">
                                    Edit
                                </a>

                                <a href="/admin/problems/delete/{{ p._id }}" class="btn btn-delete"
                                    onclick="return confirm('Delete this problem?')">
                                    Delete
                                </a>
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="empty">
                                No problems added yet
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>

    </main>
</body>

</html>
